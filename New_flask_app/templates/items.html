{% extends "base.html" %}

{% block title %}Список книг{% endblock %}

{% block content %}
    <h1>Мої улюблені книги</h1>
    <ul>
        {% for book in my_books %}
            <li>
                <strong>"{{ book.title }}"</strong> — {{ book.author }} ({{ book.year }})
            </li>
        {% else %}
            <li>Список поки порожній.</li>
        {% endfor %}
    </ul>
{% endblock %}
